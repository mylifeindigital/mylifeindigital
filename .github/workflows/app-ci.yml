# App CI — CR-019 phase 1 (validation only, never deploys).
#
# Proves that a checkout of this repository can install locked dependencies,
# pass tests and type checks, generate web/src/utils/posts-data.ts, and bundle
# the Worker — without deploying and without any credentials or secrets.
#
# Content source: publishable Markdown lives in mylifeindigital.content
# (CR-020 cutover complete); this workflow checks it out and sets CONTENT_DIR.
# The checkout uses the read-only CONTENT_CHECKOUT_TOKEN secret, which is
# available to same-repository pull requests but not to fork pull requests —
# acceptable for a single-maintainer repository. The stories section is a
# build-time artifact assembled only by the deploy workflow; it is
# intentionally absent here.
#
# Production deployment is owned exclusively by deploy.yml (phase 3, not yet
# implemented). This workflow must never receive deployment credentials.

name: App CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out application repository
        uses: actions/checkout@v5

      - name: Check out content repository
        uses: actions/checkout@v5
        with:
          repository: mylifeindigital/mylifeindigital.content
          ref: main
          path: content-repo
          token: ${{ secrets.CONTENT_CHECKOUT_TOKEN }}
          # Full history: GitDateProcessor derives updated dates from the
          # content repository's git log.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies (root workspaces)
        run: npm ci

      - name: Type-check root scripts
        run: npm run typecheck:scripts

      # web/scripts/ holds the entire content build and was covered by no
      # tsconfig at all until CR-034: web/tsconfig.json excludes `scripts`, and
      # the root program excludes `web`. The first run of this program found a
      # standing type error in build-posts.ts.
      - name: Type-check web build scripts
        run: npm run typecheck:web-scripts

      - name: Run script tests
        run: npm run test:scripts

      # Web tests run before any content step on purpose: nothing in their import
      # graph reaches the generated posts-data.ts, so they need neither the
      # content checkout nor build:posts, and they fail fast when they fail.
      - name: Run web tests
        run: npm run test:web

      # Tests are type-checked by their own program (web/tsconfig.test.json).
      # The Worker program below excludes them so that it can keep admitting only
      # workers-types — which is what makes a stray Node global in src/ an error.
      - name: Type-check web tests
        run: npm run typecheck:tests

      - name: Generate content data (posts-data.ts)
        working-directory: web
        env:
          CONTENT_DIR: ${{ github.workspace }}/content-repo/content
        # build:posts has no image mode to opt out of any more (CR-034). Image
        # URLs are frontmatter, written into the content by `generate:images`,
        # so no build anywhere depends on OpenAI credentials or credits.
        run: npm run build:posts

      - name: Type-check web app
        working-directory: web
        run: npx tsc --noEmit

      - name: Prove the Worker bundles (wrangler dry run)
        working-directory: web
        run: npx wrangler deploy --dry-run --outdir=.wrangler-ci-dist
