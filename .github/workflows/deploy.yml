# Production deployment — CR-019 phase 3.
#
# The ONLY workflow that runs `wrangler deploy`. It assembles the combined
# Worker artifact from three repositories:
#
#   - this repository            → app, pipeline, wrangler configuration
#   - mylifeindigital.content    → publishable Markdown (private; PAT checkout)
#   - story-crafter              → Golden Valley stories, transformed at build
#                                  time by `npm run sync:stories` (private; PAT)
#
# Triggers:
#   - push to main               → trusted application merges, except commits
#                                  that only touch documentation or planning
#                                  files (see paths-ignore below)
#   - repository_dispatch        → deployment requested by the content
#     (type: deploy-content)       repository after a trusted content merge
#   - workflow_dispatch          → manual/recovery deployment with explicit
#                                  app/content/story refs (rollback per CR-019)
#
# Secrets (repository Actions secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — used only by the deploy step
#   CONTENT_CHECKOUT_TOKEN — fine-grained PAT, Contents: Read-only on
#     mylifeindigital.content and story-crafter
#
# The CR-020 cutover is complete: mylifeindigital.content is the sole source of
# publishable Markdown, and Cloudflare's native Git build is disconnected, so
# this workflow is the only path to production.
#
# Operating this workflow — normal deployment, manual redeployment, rollback
# with explicit refs, and failure handling — is documented in
# .github/DEPLOYMENT.md.

name: Deploy

on:
  push:
    branches: [main]
    # Documentation and planning changes cannot alter the deployed Worker, so
    # they must not spend a full three-repository assembly to republish an
    # identical site. GitHub skips the run only when *every* changed path
    # matches, so a commit touching both code and its changelog still deploys —
    # which is the normal shape of a release commit under AGENTS.md.
    #
    # Deliberately not applied to app-ci.yml: `Validate (no deploy)` is a
    # required status check, and a skipped required check blocks a pull request
    # forever rather than passing it.
    paths-ignore:
      - "**.md"
      - "change-requests/**"
      - "docs/**"
      - "LICENSE"
  repository_dispatch:
    types: [deploy-content]
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Application ref to deploy"
        required: false
        default: "main"
      content_ref:
        description: "mylifeindigital.content ref to build"
        required: false
        default: "main"
      story_ref:
        description: "story-crafter ref to build"
        required: false
        default: "main"

permissions:
  contents: read

# Queue production deployments; never cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out application repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Check out content repository
        uses: actions/checkout@v5
        with:
          repository: mylifeindigital/mylifeindigital.content
          ref: ${{ inputs.content_ref || github.event.client_payload.content_ref || 'main' }}
          path: content-repo
          token: ${{ secrets.CONTENT_CHECKOUT_TOKEN }}
          # Full history: GitDateProcessor derives updated dates from the
          # content repository's git log.
          fetch-depth: 0

      - name: Check out story-crafter repository
        uses: actions/checkout@v5
        with:
          repository: mylifeindigital/story-crafter
          ref: ${{ inputs.story_ref || 'main' }}
          path: story-crafter
          token: ${{ secrets.CONTENT_CHECKOUT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies (root workspaces)
        run: npm ci

      - name: Validate (types and script tests)
        run: |
          npm run typecheck:scripts
          npm run test:scripts

      # Resolve the three commits ONCE, before the build (CR-030).
      #
      # They used to be resolved only in the summary step below, after
      # `wrangler deploy` — which meant the bundle had no way to say what it was
      # built from, and the only record of it lived outside the artifact. The
      # build stamp needs them beforehand, and both consumers now read the same
      # values, so the summary table and the deployed console cannot disagree.
      - name: Resolve assembled revisions
        run: |
          {
            echo "BUILD_APP_SHA=$(git rev-parse HEAD)"
            echo "BUILD_CONTENT_SHA=$(git -C content-repo rev-parse HEAD)"
            echo "BUILD_STORY_SHA=$(git -C story-crafter rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Sync stories into the assembled content
        env:
          STORY_CRAFTER_PATH: ${{ github.workspace }}/story-crafter
          CONTENT_DIR: ${{ github.workspace }}/content-repo/content
        run: npm run sync:stories

      - name: Generate content data (posts-data.ts)
        working-directory: web
        env:
          CONTENT_DIR: ${{ github.workspace }}/content-repo/content
        run: npm run build:posts

      - name: Type-check web app
        working-directory: web
        run: npx tsc --noEmit

      - name: Deploy with Wrangler
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Reads the values resolved above rather than asking git again, so this
      # table and the stamp compiled into the Worker are the same three commits
      # by construction. `if: always()` means it can run before the resolve step
      # did — a failed checkout, say — so each falls back rather than rendering
      # an empty cell that would read as "no commit" instead of "never got that
      # far".
      - name: Record deployed revisions
        if: always()
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "| Repository | Ref | Commit |"
            echo "| --- | --- | --- |"
            echo "| mylifeindigital | ${{ inputs.app_ref || github.ref_name }} | ${BUILD_APP_SHA:-unresolved} |"
            echo "| mylifeindigital.content | ${{ inputs.content_ref || github.event.client_payload.content_ref || 'main' }} | ${BUILD_CONTENT_SHA:-unresolved} |"
            echo "| story-crafter | ${{ inputs.story_ref || 'main' }} | ${BUILD_STORY_SHA:-unresolved} |"
            echo ""
            echo "Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
